<!--
  Ronda (octubre 2026): este archivo REEMPLAZA al dashboard_inversion_segura_vivo_completo.html
  original en GitHub Pages. El Google Sheet se restringió por seguridad, así que el dashboard ya
  no puede leer los datos directo desde el navegador de cada persona -- ahora lo sirve el propio
  Apps Script (ver doGet() en Codigo_Completo.gs del proyecto de Inversión Segura), que primero
  verifica el correo de Google de quien entra. Este archivo solo existe para que el link viejo
  (el que tu equipo ya tiene guardado) siga funcionando: en cuanto alguien lo abre, lo manda
  automáticamente a la URL nueva.

  PASO PENDIENTE: reemplaza el valor de EXEC_URL de abajo por la URL real que te da Google al
  desplegar el Web App del proyecto de Apps Script de INVERSIÓN SEGURA (Implementar > Nueva
  implementación > Aplicación web > Implementar > copiar la URL que empieza con
  "https://script.google.com/macros/s/..." y termina en "/exec").
-->
<script>
  const EXEC_URL = 'https://script.google.com/a/macros/interseguro.com.pe/s/AKfycbzrEwE7OBzSmMa7FxpITw3NAWSqQ1cMjTSWDWPWHKk7RFF9oHZj5rUdqf_8gQErfJmu/exec';
  if (EXEC_URL.indexOf('https://') === 0) {
    window.location.replace(EXEC_URL);
  }
</script>
